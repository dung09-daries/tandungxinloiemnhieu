<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anh xin lỗi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <img
      class="hero"
      src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=900&auto=format&fit=crop&q=60"
      alt="Cute"
    />

    <h1 class="title">Bé iuu ơi choo anhh xinn lỗi nhóooo</h1>
    <p class="subtitle">Bé bấm “Em chấp nhận” là tha lỗi cho anh đó 🥺</p>

    <div class="btn-row">
      <button id="btnYes" class="btn btn-yes">Em chấp nhận</button>
      <button id="btnNo" class="btn btn-no">Không bao giờ</button>
    </div>

    <p class="hint">Tip: chạm vào “Không bao giờ” thử xem 😼</p>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
